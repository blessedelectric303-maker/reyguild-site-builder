name: Unpack merge zip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack into place
        run: |
          set -e
          Z=$(ls *.zip | head -1)
          unzip -qo "$Z" -d .__unpack
          cp -r .__unpack/*/. .
          rm -rf .__unpack "$Z"

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Unpack T and M merge into place"
          git push
