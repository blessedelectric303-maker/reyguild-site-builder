name: Unpack merge zip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack into place
        run: |
          set -e
          test -f reyguild-tm-merge.zip
          rm -f AuditExportButton.tsx Footer.tsx HelpButton.tsx HelpSearch.tsx HelpWidget.tsx Logo.tsx roles.ts schema.prisma
          unzip -qo reyguild-tm-merge.zip -d .__unpack
          cp -r .__unpack/reyguild-tm-merge/. .
          rm -rf .__unpack reyguild-tm-merge.zip

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Unpack T and M merge into place"
          git push
